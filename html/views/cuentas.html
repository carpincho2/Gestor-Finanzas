<!-- Herramientas de datos -->
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="exportExcel()" style="font-size:12px;padding:7px 14px;">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar Excel
        </button>
        <button class="btn btn-ghost" onclick="cleanupDuplicates()" style="font-size:12px;padding:7px 14px;" title="Elimina transacciones repetidas idénticas">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Limpiar Duplicados
        </button>
      </div>

<!-- Patrimonio neto -->
      <div class="cv-worth-bar">
        <div class="cv-worth-label">Patrimonio Neto</div>
        <div class="cv-worth-total" id="cvNetWorth">$0</div>
        <div class="cv-worth-breakdown" id="cvWorthBreakdown"></div>
      </div>

      <!-- Cards de cuentas -->
      <div class="cv-top-grid" id="cvCards"></div>

      <!-- Grid: movimientos + detalle -->
      <div class="cv-main-grid">

        <!-- Izquierda: transferencia + movimientos de la cuenta -->
        <div>
          <!-- Transferencia entre cuentas -->
          <div class="cv-transfer">
            <div class="cv-transfer-title">↔ Transferencia entre cuentas</div>
            <div class="cv-transfer-row">
              <div>
                <label class="field-label">Desde</label>
                <select class="field-select" id="cvTransferFrom" onchange="onTransferAccountsChanged()"></select>
              </div>
              <button class="cv-arrow-btn" type="button" onclick="swapTransfer()" title="Invertir cuentas">⇄</button>
              <div>
                <label class="field-label">Hacia</label>
                <select class="field-select" id="cvTransferTo" onchange="onTransferAccountsChanged()"></select>
              </div>
            </div>

            <div class="form-row" style="margin-bottom:10px;">
              <div>
                <label class="field-label" id="cvTransferAmountLabel">Monto a transferir ($)</label>
                <input class="field-input" id="cvTransferAmount" type="number" min="0.01" step="any" placeholder="0.00" oninput="onTransferAmountChanged()"/>
              </div>
              <div>
                <label class="field-label">Descripción</label>
                <input class="field-input" id="cvTransferDesc" type="text" placeholder="Ej: Paso a ahorro"/>
              </div>
            </div>

            <!-- Bloque de conversión multidivisa (activo si las monedas difieren) -->
            <div id="cvCrossCurrencyBox" class="cv-cross-box" style="display:none;">
              <div class="cv-cross-header">
                <div class="cv-cross-tag" id="cvCrossTag">
                  <span class="cv-cross-icon">💱</span>
                  <span id="cvCrossPairText">Conversión USD → ARS</span>
                </div>
                <button type="button" class="cv-fetch-rate-btn" id="cvFetchRateBtn" onclick="fetchSuggestedExchangeRate()" title="Consultar cotización del mercado">
                  ⚡ Cotización sugerida
                </button>
              </div>

              <div class="cv-cross-grid">
                <div>
                  <label class="field-label" id="cvTransferRateLabel">Cotización (1 USD = ARS)</label>
                  <input class="field-input" id="cvTransferRate" type="number" min="0.0001" step="any" placeholder="1300" oninput="onTransferRateChanged()"/>
                </div>
                <div>
                  <label class="field-label" id="cvTransferAmountToLabel">Monto a recibir (ARS)</label>
                  <input class="field-input" id="cvTransferAmountTo" type="number" min="0.01" step="any" placeholder="0.00" oninput="onTransferAmountToChanged()"/>
                </div>
              </div>

              <div class="cv-cross-summary" id="cvCrossSummary">
                💡 Ingresá el monto y la cotización para calcular el destino.
              </div>
            </div>

            <button class="btn btn-primary" id="cvTransferBtn" style="width:100%;justify-content:center;margin-top:10px;" onclick="doTransfer()">
              Transferir
            </button>
          </div>

          <!-- Movimientos de la cuenta seleccionada -->
          <div class="panel">
            <div class="panel-head">
              <span class="panel-title" id="cvTxPanelTitle">Movimientos</span>
              <span class="panel-badge" id="cvTxCount">—</span>
            </div>
            <div id="cvTxList" style="padding:0 8px 12px;"></div>
          </div>
        </div>

        <!-- Derecha: detalle de la cuenta seleccionada -->
        <div class="cv-detail">
          <div class="panel" id="cvDetailPanel">
            <div class="panel-head">
              <span class="panel-title">Detalle de cuenta</span>
            </div>
            <div style="padding:20px 24px;" id="cvDetailBody">
              <div style="text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:12px;padding:20px 0;">
                Seleccioná una cuenta para ver el detalle.
              </div>
            </div>
          </div>
        </div>
      </div>
