<!-- Top action bar -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
        <div>
          <h2 style="margin:0;font-size:18px;font-weight:700;color:var(--text);">Objetivos de Ahorro</h2>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">Planificá, ahorrá y alcanzá tus metas financieras</div>
        </div>
        <button class="btn btn-primary" onclick="openGoalModal()" style="font-size:12px;padding:8px 16px;">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo Objetivo
        </button>
      </div>

      <!-- Summary stats -->
      <div class="ov-summary" id="ovSummary"></div>

      <!-- Main grid: cards + right panel -->
      <div class="ov-main-grid">

        <!-- Goal cards -->
        <div style="display:flex;flex-direction:column;gap:14px;" id="ovCards"></div>

        <!-- Right panel -->
        <div class="ov-right">

          <!-- Progress overview donut -->
          <div class="panel">
            <div class="panel-head">
              <span class="panel-title">Progreso Global</span>
              <span class="panel-badge" id="ovDonutBadge">0 objetivos</span>
            </div>
            <div style="padding:16px 24px 6px;display:flex;justify-content:center;position:relative;">
              <canvas id="ovDonutChart" style="max-width:180px;max-height:180px;"></canvas>
              <div style="position:absolute;inset:16px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;">
                <div style="font-size:22px;font-weight:800;letter-spacing:-1px;" id="ovDonutPct">0%</div>
                <div style="font-size:9px;font-family:var(--font-mono);color:var(--muted);letter-spacing:1px;text-transform:uppercase;">completado</div>
              </div>
            </div>
            <div style="padding:8px 20px 16px;" id="ovDonutLegend"></div>
          </div>

          <!-- Timeline / milestones -->
          <div class="panel">
            <div class="panel-head">
              <span class="panel-title">Próximos Vencimientos</span>
            </div>
            <div class="ov-timeline" id="ovTimeline"></div>
          </div>

          <!-- Tip -->
          <div class="panel" style="padding:20px 24px;">
            <div style="font-size:11px;font-family:var(--font-mono);color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;">💡 Consejo</div>
            <div id="ovTip" style="font-size:13px;line-height:1.6;color:var(--text);"></div>
          </div>

        </div>
      </div>
