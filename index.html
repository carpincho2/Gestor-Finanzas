<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flujo — Iniciar sesión</title>
  <meta name="description" content="Flujo — tu gestor de finanzas personal con IA. Controlá gastos, presupuestos, objetivos y más."/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div id="authScreen" class="auth-screen">
  <div class="auth-bg-orbs">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
  </div>

  <div class="auth-container">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-logo">flujo.</div>
      <div class="auth-logo-sub">Finance Manager</div>
    </div>

    <!-- Card -->
    <div class="auth-card" id="authCard">

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="authTabLogin" onclick="authSwitchTab('login')">Iniciar sesión</button>
        <button class="auth-tab" id="authTabRegister" onclick="authSwitchTab('register')">Registrarse</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="authLoginForm">
        <div class="auth-field">
          <label class="auth-label">Correo electrónico</label>
          <input class="auth-input" id="authLoginEmail" type="email" placeholder="tu@email.com" autocomplete="email"/>
        </div>
        <div class="auth-field">
          <label class="auth-label">Contraseña</label>
          <div class="auth-pw-wrap">
            <input class="auth-input" id="authLoginPw" type="password" placeholder="••••••••" autocomplete="current-password"/>
            <button class="auth-pw-toggle" onclick="authTogglePw('authLoginPw', this)" type="button">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-forgot"><a href="#" onclick="authForgot(); return false;">¿Olvidaste tu contraseña?</a></div>
        <button class="auth-btn-primary" id="authLoginBtn" onclick="authLogin()">Iniciar sesión</button>
      </div>

      <!-- REGISTER FORM -->
      <div id="authRegisterForm" style="display:none;">
        <div class="auth-field">
          <label class="auth-label">Nombre completo</label>
          <input class="auth-input" id="authRegName" type="text" placeholder="Juan Pérez" autocomplete="name"/>
        </div>
        <div class="auth-field">
          <label class="auth-label">Correo electrónico</label>
          <input class="auth-input" id="authRegEmail" type="email" placeholder="tu@email.com" autocomplete="email"/>
        </div>
        <div class="auth-field">
          <label class="auth-label">Contraseña</label>
          <div class="auth-pw-wrap">
            <input class="auth-input" id="authRegPw" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password"/>
            <button class="auth-pw-toggle" onclick="authTogglePw('authRegPw', this)" type="button">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-field">
          <label class="auth-label">Confirmar contraseña</label>
          <div class="auth-pw-wrap">
            <input class="auth-input" id="authRegPwConfirm" type="password" placeholder="Repetí tu contraseña" autocomplete="new-password"/>
            <button class="auth-pw-toggle" onclick="authTogglePw('authRegPwConfirm', this)" type="button">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button class="auth-btn-primary" id="authRegisterBtn" onclick="authRegister()">Crear cuenta</button>
      </div>

      <!-- DIVIDER -->
      <div class="auth-divider"><span>o continuá con</span></div>

      <!-- GOOGLE BUTTON CONTAINER (Evita bloqueos de popup al usar el SDK oficial de Google) -->
      <div id="googleBtnContainer" class="auth-google-container"></div>

      <!-- Error message -->
      <div class="auth-error" id="authError" style="display:none;"></div>

    </div>

    <!-- Footer -->
    <div class="auth-footer">
      Al continuar, aceptás los <a href="#">Términos de servicio</a> y la <a href="#">Política de privacidad</a>.
    </div>

  </div>
</div>

<!-- ===== GOOGLE IDENTITY SERVICES ===== -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  window.FLUJO_GOOGLE_CLIENT_ID = '181912655817-l553ttb3c4p8q0q6p7kfon2e5p60bfcu.apps.googleusercontent.com';
</script>

<script src="js/auth.js"></script>

</body>
</html>
