<div class="shopping-wrap">

  <section class="panel shopping-panel" aria-labelledby="shoppingTitle">

    <!-- Encabezado -->
    <div class="shopping-header">
      <div class="shopping-header__id">
        <div class="shopping-header__icon" aria-hidden="true">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" focusable="false"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="m9 14 2 2 4-4"/></svg>
        </div>
        <div>
          <h2 class="shopping-header__title" id="shoppingTitle">Mi Lista de Compras</h2>
          <p class="shopping-header__desc">
            Anotá los productos que necesitás y compará sus precios en supermercados con 1 solo clic.
          </p>
        </div>
      </div>

      <!-- Botones de acción global hacia SEPA -->
      <div class="shopping-header__actions">
        <button class="btn btn-secondary shopping-btn" onclick="calculateBasketOptimization()" id="shoppingBasketCalcBtn" type="button">
          <span aria-hidden="true">⚡</span> Calcular Changuito Óptimo
        </button>
        <button class="btn btn-primary shopping-btn" onclick="compareEntireListInSepa()" type="button">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Buscador SEPA
        </button>
      </div>
    </div>

    <!-- Panel de Comparativa de Changuito Completo -->
    <div id="shoppingBasketPanel" class="shopping-basket" role="region" aria-label="Comparativa de canasta en supermercados" aria-live="polite">
      <div class="shopping-basket__head">
        <div class="shopping-basket__title">
          <span aria-hidden="true">🛒</span> Comparativa de Canasta en Supermercados
        </div>
        <button type="button" class="btn btn-ghost shopping-item__remove" aria-label="Cerrar comparativa de canasta" onclick="document.getElementById('shoppingBasketPanel').style.display='none'">
          <span aria-hidden="true">✕</span>
        </button>
      </div>
      <div id="shoppingBasketContent">
        <!-- Renderizado dinámico desde shoppingList.ts -->
      </div>
    </div>

    <!-- Formulario para agregar productos -->
    <div class="shopping-form" role="group" aria-labelledby="shoppingFormTitle">
      <div class="shopping-form__title" id="shoppingFormTitle">
        <span aria-hidden="true">➕</span> Agregar producto a la lista
      </div>
      <div class="shopping-form__row">
        <div class="shopping-form__field shopping-form__field--name">
          <label class="shopping-form__label" for="shoppingItemInput">Producto</label>
          <input
            class="field-input shopping-form__control"
            id="shoppingItemInput"
            type="text"
            placeholder="Ej: Leche descremada, Yerba mate..."
            autocomplete="off"
            onkeydown="if(event.key==='Enter') addShoppingListItem()"
          />
        </div>
        <div class="shopping-form__field shopping-form__field--qty">
          <label class="shopping-form__label" for="shoppingItemQty">Cantidad</label>
          <input
            class="field-input shopping-form__control"
            id="shoppingItemQty"
            type="text"
            placeholder="Ej: 1, 2L, 500g"
            autocomplete="off"
            onkeydown="if(event.key==='Enter') addShoppingListItem()"
          />
        </div>
        <div class="shopping-form__field shopping-form__field--cat">
          <label class="shopping-form__label" for="shoppingItemCat">Categoría</label>
          <select class="field-select shopping-form__control" id="shoppingItemCat">
            <option value="Almacén">🌾 Almacén</option>
            <option value="Lácteos">🥛 Lácteos</option>
            <option value="Bebidas">🥤 Bebidas</option>
            <option value="Limpieza">🧼 Limpieza</option>
            <option value="Desayuno">☕ Desayuno</option>
            <option value="Carnicería">🥩 Carnicería</option>
            <option value="Verdulería">🥑 Verdulería</option>
            <option value="Otros">📦 Otros</option>
          </select>
        </div>
        <button class="btn btn-primary shopping-btn" onclick="addShoppingListItem()" type="button">
          Agregar
        </button>
      </div>

      <!-- Presets de canasta rápida -->
      <div class="shopping-presets" role="group" aria-label="Canastas rápidas">
        <span class="shopping-presets__label">Canastas rápidas:</span>
        <button type="button" class="shopping-chip" onclick="addShoppingPreset('basica')">
          <span aria-hidden="true">🧺</span> Básicos del Mes
        </button>
        <button type="button" class="shopping-chip" onclick="addShoppingPreset('desayuno')">
          <span aria-hidden="true">☕</span> Desayuno / Merienda
        </button>
        <button type="button" class="shopping-chip" onclick="addShoppingPreset('limpieza')">
          <span aria-hidden="true">🧼</span> Artículos de Limpieza
        </button>
      </div>
    </div>

    <!-- Lista de pendientes -->
    <div class="shopping-section">
      <div class="shopping-section__head">
        <h3 class="shopping-section__title">
          <span>Por Comprar</span>
          <span class="shopping-count" id="shoppingPendingCount" role="status">
            0 pendientes
          </span>
        </h3>
      </div>

      <div id="shoppingActiveList" role="list" aria-label="Productos por comprar">
        <!-- Renderizado dinámico desde shoppingList.ts -->
      </div>
    </div>

    <!-- Lista de comprados -->
    <div id="shoppingCompletedSection" class="shopping-completed">
      <div class="shopping-section__head">
        <h3 class="shopping-completed__title">
          Ya Comprados
        </h3>
        <button
          id="shoppingClearCompletedBtn"
          class="btn btn-ghost"
          onclick="clearCompletedShoppingList()"
          type="button"
        >
          Limpiar comprados
        </button>
      </div>

      <div id="shoppingCompletedList" role="list" aria-label="Productos ya comprados">
        <!-- Renderizado dinámico desde shoppingList.ts -->
      </div>
    </div>

  </section>
</div>
