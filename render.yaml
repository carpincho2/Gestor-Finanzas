services:
  - type: web
    name: flujo-finance-manager
    env: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flujo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set manually in Render dashboard
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard (Gemini API Key)
      - key: ENCRYPTION_KEY
        generateValue: true  # Clave Fernet para cifrar tokens de billeteras
      - key: MP_CLIENT_ID
        sync: false  # Set manually in Render dashboard
      - key: MP_CLIENT_SECRET
        sync: false  # Set manually in Render dashboard
      - key: MP_REDIRECT_URI
        sync: false  # Set manually in Render dashboard (URL de callback)

databases:
  - name: flujo-db
    plan: free
    postgresMajorVersion: 15
